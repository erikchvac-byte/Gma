<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); font-family: var(--font-sans); }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
  .glabel { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
  .stack { display: grid; gap: 12px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../assets/icons.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { SkeletonFeed, Notice } = window.GmaSHelperDesignSystem_45dd11;
    function Demo() {
      return (
        <div className="wrap">
          <div>
            <div className="glabel">Loading</div>
            <SkeletonFeed rows={3} />
          </div>
          <div>
            <div className="glabel">Notices</div>
            <div className="stack">
              <Notice variant="urgent" icon={<Icon name="clock" size={16} />}>Ends in 24 min</Notice>
              <Notice variant="error" icon={<Icon name="triangle-alert" size={16} />}>Couldn't load deals. Please try again later.</Notice>
              <Notice variant="default" icon={<Icon name="info" size={16} />}>Gas cost uses the national average MPG.</Notice>
              <Notice variant="muted">2 sources unavailable · Last updated Jun 10, 7:45&nbsp;AM</Notice>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
