    <title>gmas list — cannabis deals worth the drive</title>

      name="description"
      content="Gmas List is an independent information service — not a cannabis seller — that helps Washington shoppers discover publicly available deals from licensed retailers and compare savings, distance, and convenience to find deals worth the drive."

    <!-- Entity identity for search/AI crawlers (spec-ai-search-about-faq).
         WebSite + Organization only; Service + FAQPage live on the
         server-rendered /about page. No SearchAction: the site has no /search. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://gmaslist.com/#website",
            "url": "https://gmaslist.com/",
            "name": "Gmas List",
            "description": "Gmas List is an independent consumer information service that helps people discover, compare, and evaluate publicly available cannabis deals from licensed Washington retailers and decide whether the savings are worth the drive.",
            "publisher": { "@id": "https://gmaslist.com/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://gmaslist.com/#organization",
            "name": "Gmas List",
            "url": "https://gmaslist.com/",
            "description": "Gmas List is an independent information service. It does not sell cannabis, process transactions, or represent cannabis businesses; it helps consumers discover publicly available deals from licensed Washington retailers."
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Async font CSS (ADR-081): the plain stylesheet link render-blocked first
         paint by ~870ms on mobile (Lighthouse). media="print" makes the browser
         fetch it without blocking render; onload flips it live. display=swap in
         the URL keeps text visible on the fallback font meanwhile. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"

      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
