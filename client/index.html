<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js). The stub (dataLayer + gtag() + js/config) stays
         inline so any early event queues; the ~166KB gtag.js download is deferred
         to browser idle after load so it doesn't compete with first paint /
         hydration (Lighthouse: ~68KB unused during initial load). Queued events
         flush once the script arrives — measurement is unchanged, just later. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Z3EH6D5C89');
      addEventListener('load', function () {
        function loadGtag() {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-Z3EH6D5C89';
          document.head.appendChild(s);
        }
        // timeout caps idle-callback starvation on a busy main thread so gtag.js
        // (and the queued dataLayer events) can't be deferred indefinitely; older
        // engines without requestIdleCallback fall back to a plain timer.
        if (window.requestIdleCallback) requestIdleCallback(loadGtag, { timeout: 3000 });
        else setTimeout(loadGtag, 1500);
      });
    </script>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E1417" />
    <title>gmas list — cannabis deals worth the drive</title>
    <meta
      name="description"
      content="Gmas List is an independent information service — not a cannabis seller — that helps Washington shoppers discover publicly available deals from licensed retailers and compare savings, distance, and convenience to find deals worth the drive."
    />
    <!-- Entity identity for search/AI crawlers (spec-ai-search-about-faq).
         WebSite + Organization only; Service + FAQPage live on the
         server-rendered /about page. No SearchAction: the site has no /search. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://gmaslist.com/#website",
            "url": "https://gmaslist.com/",
            "name": "Gmas List",
            "description": "Gmas List is an independent consumer information service that helps people discover, compare, and evaluate publicly available cannabis deals from licensed Washington retailers and decide whether the savings are worth the drive.",
            "publisher": { "@id": "https://gmaslist.com/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://gmaslist.com/#organization",
            "name": "Gmas List",
            "url": "https://gmaslist.com/",
            "description": "Gmas List is an independent information service. It does not sell cannabis, process transactions, or represent cannabis businesses; it helps consumers discover publicly available deals from licensed Washington retailers."
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Async font CSS (ADR-081): the plain stylesheet link render-blocked first
         paint by ~870ms on mobile (Lighthouse). media="print" makes the browser
         fetch it without blocking render; onload flips it live. display=optional
         keeps text visible on the fallback font meanwhile AND never swaps a
         late-arriving web font in — killing the FOUT reflow that was ~91% of the
         mobile CLS past the age gate (spec-perf-cls-analytics-wins). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=optional"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=optional"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=optional"
        rel="stylesheet"
      />
    </noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
