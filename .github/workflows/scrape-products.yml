name: scrape-products

# ADR-053: lower-frequency (daily) product/menu-pricing scrape. Boots the Python
# stealth-browser scraper in-job, runs the Node product pipeline against it
# (scrapeProductsRun.ts: scrape -> normalize -> APPEND timestamped observation), and
# commits the refreshed server/data/products.json back to the repo. Commit-back is the
# durable store because Render's disk is ephemeral (a server-written file would lose
# history every deploy). Entirely separate from scrape-ingest.yml (deals) — different
# schedule, different file, different endpoint; the deals pipeline is untouched.
#
# Prices move slowly and the payload is heavy, so this runs once a day, NOT hourly, and
# NOT on push (no live-refresh need — /api/products just reads the committed file).

on:
  schedule:
    - cron: '0 8 * * *' # daily 08:00 UTC
  workflow_dispatch: {} # manual trigger for testing

# Required by the commit-back step to push the refreshed dataset.
permissions:
  contents: write

# Serialize with itself; never with the deals workflow (different group).
concurrency:
  group: scrape-products
  cancel-in-progress: false

jobs:
  scrape-products:
    runs-on: ubuntu-latest
    # A scrape hiccup must not block the commit of whatever WAS captured — the run
    # appends to history and is low-stakes (R&D/private dataset), not an alert source.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `git pull --rebase` can integrate concurrent commits
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: server

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install scraper deps
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
        working-directory: scraper-svc
      - name: Boot scraper service
        run: |
          nohup python -m uvicorn api.server:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health || { echo 'scraper failed to start'; cat uvicorn.log; exit 1; }
        working-directory: scraper-svc

      # Run via tsx against SOURCE (not compiled dist) so DEFAULT_PRODUCTS_PATH resolves
      # to server/data/products.json — the file committed back below (ADR-053 gotcha).
      - name: Scrape & append product prices
        run: npx tsx scripts/scrapeProductsRun.ts
        working-directory: server
        env:
          SCRAPER_URL: http://127.0.0.1:8000/scrape

      # Commit ONLY products.json (never `git add -A`). [skip ci] + no push trigger means
      # this commit cannot re-trigger any workflow. A persistent push failure warns rather
      # than reds the run.
      - name: Commit refreshed product prices to master
        if: always()
        run: |
          if [ -z "$(git status --porcelain server/data/products.json)" ]; then
            echo "products.json unchanged — nothing to commit"
            exit 0
          fi
          git config user.name 'gma-bot'
          git config user.email 'gma-bot@users.noreply.github.com'
          git add server/data/products.json
          git commit -m 'chore(data): refresh product prices [skip ci]'
          for attempt in 1 2; do
            git pull --rebase --autostash origin master && git push origin HEAD:master && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep 3
          done
          echo "::warning::commit-back push to master failed after retries — product prices not refreshed this run"
        working-directory: .
