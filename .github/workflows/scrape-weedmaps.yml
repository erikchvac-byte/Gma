name: scrape-weedmaps

# AI-search Phase 2: commit-back PRODUCT scrape for the SECOND source — Weedmaps. Unlike
# scrape-products.yml (Dutchie), the fetch is STATIC (plain HTTPS GET + __NEXT_DATA__ parse),
# so this job needs NO Python / Playwright / scraper-svc — just Node. It runs
# scrapeWeedmapsRun.ts (fetch -> normalize -> APPEND timestamped observation, ≥2s jittered
# throttle between stores) and commits the refreshed server/data/products.json back to the
# repo. Commit-back is the durable store because Render's disk is ephemeral. Entirely
# separate from scrape-ingest.yml (deals) and scrape-products.yml (Dutchie products) — the
# matcher reads the same products.json and picks up Weedmaps with zero code change.
#
# ⚠️ SCHEDULE INTENTIONALLY DISABLED — DO NOT ENABLE. The scaled-crawl gate passed from a
# RESIDENTIAL IP, but GitHub-Actions/datacenter IPs are WALLED (gate caveat #4, CONFIRMED). A
# workflow_dispatch re-probe (2026-06-29, run 28406848309) got HTTP 406 on 44/44 requests; the
# same desktop UA gets 200 from a residential IP, so the block is IP-driven, not header-driven —
# uncommenting `schedule:` would just 406 nightly.
#
# Accrual instead runs from a RESIDENTIAL IP via the committed runner
# `scripts/scrape-weedmaps-local.ps1` (set up once by `scripts/setup-weedmaps-task.ps1`, which
# registers a nightly Windows Scheduled Task in an isolated master-pinned git worktree). It
# mirrors the commit-back step below. See docs/weedmaps-residential-ingest.md and ADR-064.

on:
  # schedule:  # DO NOT ENABLE — datacenter IP is 406-walled (see header re-probe 2026-06-29)
  #   - cron: '0 9 * * *' # nightly 09:00 UTC — would 406 from GitHub-Actions runners
  workflow_dispatch: {} # manual trigger only (kept to re-probe the runner IP in future)

# Required by the commit-back step to push the refreshed dataset.
permissions:
  contents: write

# Serialize with itself; never with the deals or Dutchie-products workflows (different groups).
concurrency:
  group: scrape-weedmaps
  cancel-in-progress: false

jobs:
  scrape-weedmaps:
    runs-on: ubuntu-latest
    # A scrape hiccup / per-store block must not abort the commit of whatever WAS captured —
    # the run appends to history and is low-stakes (R&D/private dataset), not an alert source.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `git pull --rebase` can integrate concurrent commits
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: server

      # Run via tsx against SOURCE (not compiled dist) so DEFAULT_PRODUCTS_PATH resolves to
      # server/data/products.json — the file committed back below (same ADR-053 gotcha as Dutchie).
      - name: Scrape & append Weedmaps product prices
        run: npx tsx scripts/scrapeWeedmapsRun.ts
        working-directory: server

      # Commit ONLY products.json (never `git add -A`). [skip ci] + no push trigger means this
      # commit cannot re-trigger any workflow. A persistent push failure warns rather than reds.
      - name: Commit refreshed product prices to master
        if: always()
        run: |
          if [ -z "$(git status --porcelain server/data/products.json)" ]; then
            echo "products.json unchanged — nothing to commit"
            exit 0
          fi
          git config user.name 'gma-bot'
          git config user.email 'gma-bot@users.noreply.github.com'
          git add server/data/products.json
          git commit -m 'chore(data): refresh weedmaps product prices [skip ci]'
          for attempt in 1 2; do
            git pull --rebase --autostash origin master && git push origin HEAD:master && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep 3
          done
          echo "::warning::commit-back push to master failed after retries — weedmaps prices not refreshed this run"
        working-directory: .
