# Render Blueprint — one Node web service serves both the React client and the
# Express API. Render auto-detects this file on "New > Blueprint" (or when you
# create a Web Service from the repo) and fills in the fields below.
services:
  - type: web
    name: gmaslist
    runtime: node
    plan: free
    # Root `build` self-installs client/server deps with --include=dev (else
    # NODE_ENV=production skips vite/tsc and the build fails), then builds both.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
