<!-- @dsCard group="Colors" viewport="700x170" name="Semantic & status" subtitle="Amber is reserved for urgency; red for errors; status accents" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); font-family: var(--font-sans); color: var(--text-body); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .group-title { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
  .row { display: flex; gap: 8px; }
  .sw { flex: 1; }
  .chip { height: 44px; border-radius: var(--radius-md); border: 1px solid rgba(0,0,0,0.06); }
  .name { font-size: 11px; font-weight: 600; color: var(--text-strong); margin-top: 6px; }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
  .statusrow { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .dot { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--text-body); }
  .dot::before { content:''; width:10px; height:10px; border-radius:50%; }
</style>
</head>
<body>
  <div class="grid">
    <div>
      <div class="group-title">Amber · urgency only</div>
      <div class="row">
        <div class="sw"><div class="chip" style="background:var(--amber-50)"></div><div class="name">50</div><div class="hex">#fffbeb</div></div>
        <div class="sw"><div class="chip" style="background:var(--amber-100)"></div><div class="name">100</div><div class="hex">#fef3c7</div></div>
        <div class="sw"><div class="chip" style="background:var(--amber-600)"></div><div class="name">600</div><div class="hex">#d97706</div></div>
        <div class="sw"><div class="chip" style="background:var(--amber-700)"></div><div class="name">700</div><div class="hex">#b45309</div></div>
      </div>
    </div>
    <div>
      <div class="group-title">Red · errors</div>
      <div class="row">
        <div class="sw"><div class="chip" style="background:var(--red-50)"></div><div class="name">50</div><div class="hex">#fef2f2</div></div>
        <div class="sw"><div class="chip" style="background:var(--red-200)"></div><div class="name">200</div><div class="hex">#fecaca</div></div>
        <div class="sw"><div class="chip" style="background:var(--red-600)"></div><div class="name">600</div><div class="hex">#dc2626</div></div>
        <div class="sw"><div class="chip" style="background:var(--red-700)"></div><div class="name">700</div><div class="hex">#b91c1c</div></div>
      </div>
    </div>
  </div>
  <div style="margin-top:20px">
    <div class="group-title">Status accents</div>
    <div class="statusrow">
      <span class="dot" style="--c:var(--status-fresh)"><span style="width:10px;height:10px;border-radius:50%;background:var(--status-fresh);display:inline-block"></span>Fresh</span>
      <span class="dot"><span style="width:10px;height:10px;border-radius:50%;background:var(--status-stale);display:inline-block"></span>Stale</span>
      <span class="dot"><span style="width:10px;height:10px;border-radius:50%;background:var(--status-urgent);display:inline-block"></span>Urgent</span>
      <span class="dot"><span style="width:10px;height:10px;border-radius:50%;background:var(--status-error);display:inline-block"></span>Error</span>
    </div>
  </div>
</body>
</html>
