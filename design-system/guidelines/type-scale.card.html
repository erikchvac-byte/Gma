<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="Mobile-first scale — built for a phone in a driveway" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); font-family: var(--font-sans); }
  .line { display: flex; align-items: baseline; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--gray-100); }
  .line:last-child { border-bottom: none; }
  .tok { flex: none; width: 120px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .px { flex: none; width: 48px; font-family: var(--font-mono); font-size: 11px; color: var(--gray-400); text-align: right; }
  .samp { color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="line"><span class="tok">--text-2xl</span><span class="px">24</span><span class="samp" style="font-size:24px;font-weight:700">Gma's Helper</span></div>
  <div class="line"><span class="tok">--text-xl</span><span class="px">20</span><span class="samp" style="font-size:20px;font-weight:600">Within 25 miles</span></div>
  <div class="line"><span class="tok">--text-lg</span><span class="px">18</span><span class="samp" style="font-size:18px;font-weight:400">You must be 21 or older.</span></div>
  <div class="line"><span class="tok">--text-base</span><span class="px">16</span><span class="samp" style="font-size:16px">Top-shelf flower, 30% off all day</span></div>
  <div class="line"><span class="tok">--text-sm</span><span class="px">14</span><span class="samp" style="font-size:14px;color:var(--text-muted)">9.8 miles · Last updated Jun 10, 7:45 AM</span></div>
  <div class="line"><span class="tok">--text-xs</span><span class="px">12</span><span class="samp" style="font-size:12px;color:var(--text-muted)">2 SOURCES UNAVAILABLE</span></div>
</body>
</html>
