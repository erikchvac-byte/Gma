<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radius" subtitle="rounded-lg (8px) is the house corner — buttons, cards, inputs" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); font-family: var(--font-sans); }
  .row { display: flex; gap: 22px; align-items: flex-end; }
  .item { text-align: center; }
  .box { width: 72px; height: 56px; background: var(--green-50); border: 1.5px solid var(--green-700); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 9px; }
  .px { font-size: 11px; color: var(--gray-400); }
  .star { color: var(--green-700); font-weight: 700; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="name">sm</div><div class="px">4px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="name">md</div><div class="px">6px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="name star">lg ·default</div><div class="px">8px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="name">xl</div><div class="px">12px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="name">2xl</div><div class="px">16px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-full);width:56px"></div><div class="name">full</div><div class="px">pill</div></div>
  </div>
</body>
</html>
