<!-- @dsCard group="Spacing" viewport="700x190" name="Spacing scale" subtitle="4px base grid — tight, scannable density (the Tailwind heritage)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); font-family: var(--font-sans); }
  .line { display: flex; align-items: center; gap: 14px; padding: 5px 0; }
  .tok { width: 92px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .px { width: 44px; font-family: var(--font-mono); font-size: 11px; color: var(--gray-400); text-align: right; }
  .bar { height: 14px; background: var(--green-700); border-radius: 3px; }
</style>
</head>
<body>
  <div class="line"><span class="tok">--space-1</span><span class="px">4</span><span class="bar" style="width:4px"></span></div>
  <div class="line"><span class="tok">--space-2</span><span class="px">8</span><span class="bar" style="width:8px"></span></div>
  <div class="line"><span class="tok">--space-3</span><span class="px">12</span><span class="bar" style="width:12px"></span></div>
  <div class="line"><span class="tok">--space-4</span><span class="px">16</span><span class="bar" style="width:16px"></span></div>
  <div class="line"><span class="tok">--space-6</span><span class="px">24</span><span class="bar" style="width:24px"></span></div>
  <div class="line"><span class="tok">--space-8</span><span class="px">32</span><span class="bar" style="width:32px"></span></div>
  <div class="line"><span class="tok">--space-12</span><span class="px">48</span><span class="bar" style="width:48px"></span></div>
  <div class="line"><span class="tok">--space-16</span><span class="px">64</span><span class="bar" style="width:64px"></span></div>
</body>
</html>
